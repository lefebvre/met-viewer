name: CI

# Build + test on every push to master and every pull request. Uses the same
# dynamic-Qt "dist" presets that the release pipeline ships, so CI exercises the
# exact configuration users receive.

on:
  push:
    branches: [master]
  pull_request:
  # ThreadSanitizer runs on a schedule rather than per-push. It is several times
  # slower than the plain suite and the threading surface changes rarely, so a
  # weekly pass is the right cadence; workflow_dispatch is there for the run
  # right after a change to the pool, the job plumbing or the reader locking.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The event is part of the group and only pull requests cancel: a push to master
# shares master's ref with the weekly TSan run, and with one group per ref the
# push cancelled the scheduled run (or the reverse) halfway through.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  # Formatting is its own job, deliberately not a step in the build: it needs no
  # dependencies, so it reports in well under a minute instead of after Qt has
  # compiled. `cmake --build --target format-check` is the same check for local
  # use; this job avoids configuring CMake at all, since that would drag in the
  # whole vcpkg toolchain just to run a formatter.
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Pinned, and pinned to the same version cmake/Format.cmake records.
      # clang-format's output shifts between major releases, so an unpinned
      # binary would flag the tool's differences as if they were the author's —
      # the usual way a format gate decays into permanent red.
      - name: Install clang-format
        run: pip install --disable-pip-version-check clang-format==21.1.8

      - name: Check formatting
        run: |
          set -euo pipefail
          clang-format --version
          # Same set as cmake/Format.cmake's glob; keep the two in step.
          mapfile -t files < <(find viewer tests \
            \( -name '*.cpp' -o -name '*.h' \) ! -name 'colormaps_data.h' | sort)
          echo "checking ${#files[@]} files"
          clang-format --dry-run --Werror --style=file "${files[@]}"

      - name: How to fix
        if: failure()
        run: |
          echo "Formatting differs from .clang-format. Fix it with either:"
          echo "  cmake --build build/release --target format"
          echo "  pip install clang-format==21.1.8 && clang-format -i --style=file <files>"

  linux:
    name: Linux (AlmaLinux 9)
    runs-on: ubuntu-latest
    # Build inside AlmaLinux 9 so the toolchain/glibc floor (2.34) matches the
    # supported RHEL/Alma/Rocky 9 + 10 range, and the dnf deps below match the
    # ones documented in README.md.
    container: almalinux:9
    # A cold dependency build (Qt from source) takes over an hour; a hang -- a
    # modal Qt dialog, a deadlock under TSan -- would otherwise run to GitHub's
    # six-hour limit.
    timeout-minutes: 240
    steps:
      - name: Install system build dependencies
        run: |
          set -euxo pipefail
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y \
            git cmake ninja-build gcc-c++ make perl zip file which tar \
            libasan libubsan libtsan \
            libxcb-devel libX11-devel mesa-libGLU-devel libXrender-devel \
            libXi-devel libxkbcommon-devel libxkbcommon-x11-devel mesa-libEGL-devel \
            gperf fontconfig-devel freetype-devel \
            xcb-util-cursor-devel xcb-util-wm-devel xcb-util-devel \
            xcb-util-image-devel xcb-util-keysyms-devel xcb-util-renderutil-devel \
            perl-IPC-Cmd perl-FindBin perl-Text-Template perl-Time-Piece \
            perl-Unicode-Normalize perl-Test-Harness perl-Module-Loaded \
            perl-ExtUtils-MakeMaker perl-Sys-Hostname \
            automake libtool autoconf-archive m4 bison flex \
            xorg-x11-server-Xvfb mesa-dri-drivers
          # AlmaLinux 9 ships autoconf 2.69, but some ports (libb2) need >= 2.71.
          # The autoconf tarball ships a pre-generated configure, so building it
          # needs only m4/perl/make (no bootstrap autoconf).
          curl -fsSLO https://ftp.gnu.org/gnu/autoconf/autoconf-2.71.tar.gz
          tar xf autoconf-2.71.tar.gz
          (cd autoconf-2.71 && ./configure --prefix=/usr/local >/dev/null \
             && make -j"$(nproc)" >/dev/null && make install >/dev/null)
          hash -r
          autoconf --version | head -1

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Trust workspace (git runs as root in the container)
        run: git config --global --add safe.directory '*'

      # Restore/save are split (rather than the combined actions/cache) because
      # the combined action only saves on success. A run that dies partway
      # through vcpkg would otherwise cache nothing despite most packages having
      # built and downloaded fine, and the next run would repeat all of it —
      # which is exactly how one upstream hiccup became a hard block.
      # VCPKG_BINARY_SOURCES is set here at runtime rather than in the workflow's
      # env: block, because `${{ github.workspace }}` is expanded on the *host*.
      # In a container job that yields /home/runner/work/... while the workspace
      # is mounted at /__w/... inside — so vcpkg wrote its binaries somewhere
      # actions/cache never looked, and the cache silently stayed empty.
      # $GITHUB_WORKSPACE is evaluated inside the job, so it is correct on both.
      - name: Point vcpkg at the workspace binary cache
        shell: bash
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/vcpkg_bincache,readwrite" >> "$GITHUB_ENV"

      # Each save goes under its own run-specific key, and a restore takes the
      # newest save for the same dependency set, else the newest of any. Saving
      # under the exact restore key instead meant a run that died partway through
      # the Qt build stored its partial cache under the final key; every later
      # run then "hit" it, rebuilt the missing ports, and never saved again until
      # vcpkg.json changed. A runner compiler update had the same effect.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        id: bincache
        with:
          path: vcpkg_bincache
          # vcpkg.json carries builtin-baseline, so hashing it pins both the
          # dependency list and the vcpkg commit; the overlays change the ABI too.
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/*.cmake', 'cmake/vcpkg-overlay-ports/**') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/*.cmake', 'cmake/vcpkg-overlay-ports/**') }}-
            vcpkg-bin-${{ runner.os }}-

      # Source tarballs, cached separately and keyed more loosely. This is what
      # stops upstream hosts being re-asked for every distfile on a binary-cache
      # miss — one of them (libaec, on a small academic host) answers HTTP 429
      # when hit repeatedly, which is what broke this pipeline.
      - name: Restore vcpkg downloads
        uses: actions/cache/restore@v4
        id: dlcache
        with:
          path: vcpkg/downloads
          key: vcpkg-dl-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-dl-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-dl-${{ runner.os }}-

      # What the restore brought, so the saves below run only when vcpkg added
      # something. Every save is a new multi-gigabyte entry now that keys are
      # per-run, and an unchanged one would only push older ones out.
      - name: Count restored dependency files
        id: before
        shell: bash
        run: |
          echo "bin=$(find vcpkg_bincache -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
          echo "dl=$(find vcpkg/downloads -maxdepth 1 -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Configure
        # -Werror here rather than only in the asan preset: the warning set
        # (-Wall -Wextra -Wpedantic -Wconversion -Wsign-conversion -Wshadow) is
        # only a gate if something actually fails on it, and the tree is clean.
        run: cmake --preset dist-linux -DMET_WERROR=ON

      - name: Check for new dependency files
        id: after
        if: always()
        shell: bash
        run: |
          bin=$(find vcpkg_bincache -type f 2>/dev/null | wc -l)
          dl=$(find vcpkg/downloads -maxdepth 1 -type f 2>/dev/null | wc -l)
          echo "bin=$([ "$bin" != "${{ steps.before.outputs.bin }}" ] && echo changed || echo same)" >> "$GITHUB_OUTPUT"
          echo "dl=$([ "$dl" != "${{ steps.before.outputs.dl }}" ] && echo changed || echo same)" >> "$GITHUB_OUTPUT"

      # Saved right after configure, which is where vcpkg does its work, and with
      # `always()` so a later build/test failure still leaves the dependency work
      # behind for the next run.
      - name: Save vcpkg binary cache
        uses: actions/cache/save@v4
        # A cache write must never fail the job: on an early failure the
        # directory may not exist yet, and that is not an error worth reporting.
        continue-on-error: true
        if: always() && steps.after.outputs.bin == 'changed'
        with:
          path: vcpkg_bincache
          key: ${{ steps.bincache.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Save vcpkg downloads
        uses: actions/cache/save@v4
        continue-on-error: true
        if: always() && steps.after.outputs.dl == 'changed'
        with:
          path: vcpkg/downloads
          key: ${{ steps.dlcache.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Dump vcpkg logs on failure
        if: failure()
        run: |
          echo "===== vcpkg-manifest-install.log (names the failed port) ====="
          cat build/dist-linux/vcpkg-manifest-install.log 2>/dev/null || echo "(not found)"
          echo "===== port build stdout/stderr (the real error) ====="
          # Skip config-*.log: its arch-probe failures (arm_acle.h etc.) are expected noise.
          for f in $(find vcpkg/buildtrees -maxdepth 2 \
                       \( -name 'install-*-out.log' -o -name 'install-*-err.log' \
                          -o -name 'build-*-out.log' -o -name 'build-*-err.log' \) 2>/dev/null); do
            echo "----- $f -----"; tail -n 60 "$f"; done

      - name: Build
        run: cmake --build --preset dist-linux

      - name: Test
        run: ctest --preset dist-linux

      - name: Headless smoke test (software GL)
        run: |
          set -euxo pipefail
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1
          sleep 2
          ./build/dist-linux/viewer/app/met_viewer --grab /tmp/smoke.png
          test -s /tmp/smoke.png

      # The suite runs in ~3 s, so running it a second time under
      # address/undefined sanitizers is nearly free and is the only thing that
      # covers the reader/threading paths for memory errors. Needs libasan /
      # libubsan (installed above) — GCC only ships the compiler side.
      #
      # asan-dist, not asan: the plain preset takes the default x64-linux triplet
      # and would build a second complete dependency set (static Qt included)
      # rather than reusing the one the dist-linux configure just produced.
      - name: Configure (asan)
        run: cmake --preset asan-dist

      - name: Build (asan)
        run: cmake --build --preset asan-dist

      - name: Test (asan)
        env:
          # Leak detection is off: the value here is catching use-after-free, OOB
          # and UB in our own code, and the Qt/PROJ/ecCodes globals produce leak
          # reports we neither own nor can suppress usefully.
          ASAN_OPTIONS: detect_leaks=0
          # halt_on_error so a UB report fails the job instead of scrolling past.
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # Same two timing tripwires excluded as on Windows, for a stronger reason:
        # a sanitized build is several times slower by design, so a wall-clock
        # budget measures the instrumentation rather than the code.
        run: ctest --preset asan-dist -E 'Warp\.(Projected)?PerformanceTripwire'

      # TSan covers the concurrency ASan structurally cannot see: the warp's row
      # chunks running across the parked worker pool, the pooled decode/section
      # jobs delivering through queued invokeMethod, and the process-wide netcdf-c
      # mutex. A race in any of those produces wrong values rather than a crash,
      # so nothing else in this pipeline would notice.
      #
      # Scheduled/dispatch only, and a separate build directory: ASan and TSan are
      # different runtimes and cannot be linked into the same binary. It reuses the
      # dist-linux triplet, so no dependency is rebuilt for it.
      - name: Configure (tsan)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cmake --preset tsan-dist

      - name: Build (tsan)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cmake --build --preset tsan-dist

      - name: Test (tsan)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # halt_on_error keeps the first race as the visible failure instead of
        # burying it under whatever the run does afterwards. The suppressions
        # file exists to hold third-party noise (Qt/PROJ/HDF5 internals we
        # neither own nor can fix) — see the file for the rule on adding to it.
        # TSAN_OPTIONS is set at runtime from $GITHUB_WORKSPACE for the same
        # reason as VCPKG_BINARY_SOURCES above: `${{ github.workspace }}` is the
        # host path, which does not exist inside the container, and TSan aborts
        # every test binary when it cannot read the suppressions file.
        #
        # The timing tripwires are excluded for the same reason as the asan run: a
        # wall-clock budget under instrumentation measures TSan, not the code.
        shell: bash
        run: |
          export TSAN_OPTIONS="halt_on_error=1:second_deadlock_stack=1:suppressions=$GITHUB_WORKSPACE/.tsan-suppressions"
          ctest --preset tsan-dist -E 'Warp\.(Projected)?PerformanceTripwire'

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Put MSVC (cl/link) on PATH so the Ninja-based preset can find the
      # compiler without a Visual Studio developer shell.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1

      # See the Linux job for why restore/save are split.
      # Same runtime-set binary cache path as the Linux job; see there for why it
      # is not set from `${{ github.workspace }}` in the workflow env: block.
      - name: Point vcpkg at the workspace binary cache
        shell: bash
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/vcpkg_bincache,readwrite" >> "$GITHUB_ENV"

      # Keys and the save conditions work as in the Linux job; see there.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        id: bincache
        with:
          path: vcpkg_bincache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/*.cmake', 'cmake/vcpkg-overlay-ports/**') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/*.cmake', 'cmake/vcpkg-overlay-ports/**') }}-
            vcpkg-bin-${{ runner.os }}-

      - name: Restore vcpkg downloads
        uses: actions/cache/restore@v4
        id: dlcache
        with:
          path: vcpkg/downloads
          key: vcpkg-dl-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-dl-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-dl-${{ runner.os }}-

      - name: Count restored dependency files
        id: before
        shell: bash
        run: |
          echo "bin=$(find vcpkg_bincache -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
          echo "dl=$(find vcpkg/downloads -maxdepth 1 -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Configure
        # -Werror as on Linux, so MSVC's /W4 is a gate rather than advice. Without
        # it, warnings Linux would have refused accumulated in the Windows build.
        run: cmake --preset dist-windows -DMET_WERROR=ON

      - name: Check for new dependency files
        id: after
        if: always()
        shell: bash
        run: |
          bin=$(find vcpkg_bincache -type f 2>/dev/null | wc -l)
          dl=$(find vcpkg/downloads -maxdepth 1 -type f 2>/dev/null | wc -l)
          echo "bin=$([ "$bin" != "${{ steps.before.outputs.bin }}" ] && echo changed || echo same)" >> "$GITHUB_OUTPUT"
          echo "dl=$([ "$dl" != "${{ steps.before.outputs.dl }}" ] && echo changed || echo same)" >> "$GITHUB_OUTPUT"

      - name: Save vcpkg binary cache
        uses: actions/cache/save@v4
        # A cache write must never fail the job: on an early failure the
        # directory may not exist yet, and that is not an error worth reporting.
        continue-on-error: true
        if: always() && steps.after.outputs.bin == 'changed'
        with:
          path: vcpkg_bincache
          key: ${{ steps.bincache.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Save vcpkg downloads
        uses: actions/cache/save@v4
        continue-on-error: true
        if: always() && steps.after.outputs.dl == 'changed'
        with:
          path: vcpkg/downloads
          key: ${{ steps.dlcache.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Build
        run: cmake --build --preset dist-windows

      # The suite runs here, not just on Linux. The behaviour is *not*
      # platform-identical: `long` is 32 bit on MSVC and 64 on Linux, which is
      # why the ARL reader carries int64 record offsets and the GRIB reader a
      # seek64 helper — a Linux-only suite cannot regress-test either.
      #
      # x64-windows is a dynamic triplet, so the test executables need the Qt and
      # dependency DLLs, and met_app_tests needs the minimal platform plugin for
      # the QT_QPA_PLATFORM it sets. Both now sit in the build tree beside the
      # executables -- the DLLs from vcpkg's applocal step, the plugins from
      # met_deploy_qt_runtime() in cmake/QtDeploy.cmake -- so no Qt environment
      # is set up here. The vcpkg bin directory stays on PATH as a cheap
      # fallback, and has to be in place before ctest either way, since
      # gtest_discover_tests(PRE_TEST) runs the executables to enumerate tests.
      - name: Test
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\vcpkg_installed\x64-windows\bin;$env:PATH"
          # The two Warp tripwires assert wall-clock budgets. They are useful as
          # regression detectors on the consistent Linux runner; on a shared
          # Windows runner they would only add flakiness.
          ctest --preset dist-windows -E 'Warp\.(Projected)?PerformanceTripwire'

      # A self-contained tree to download and run: `cmake --install` copies the
      # dependency DLLs and the MSVC runtime beside the executable, then runs the
      # windeployqt script from cmake/Packaging.cmake for Qt's plugins, and PROJ's
      # data lands in share/proj where main.cpp's executable-relative probe finds it.
      - name: Stage portable build
        run: cmake --install build/dist-windows --prefix "${{ github.workspace }}/dist/met-viewer"

      # Start the *installed* executable with nothing but the OS on PATH. The
      # build tree always runs, because vcpkg's applocal step puts every DLL beside
      # it; the install tree is assembled by different rules, and once shipped
      # without PROJ, ecCodes, netCDF or Qt's own dependencies while every check
      # above stayed green. A missing DLL fails here as 0xC0000135.
      - name: Smoke-test the installed build
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $exe = "${{ github.workspace }}\dist\met-viewer\bin\met_viewer.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru `
                             -NoNewWindow -RedirectStandardOutput version.txt
          Get-Content version.txt
          if ($p.ExitCode -ne 0) {
            throw ("installed met_viewer.exe exited 0x{0:X8}" -f $p.ExitCode)
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: met-viewer-windows-${{ github.sha }}
          path: dist/met-viewer
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon)
    # An arm64 runner. Clang with libc++ is a third compiler and standard library
    # beside GCC and MSVC, and int64_t is `long long` here rather than Linux's
    # `long`, so this catches what neither of the others would.
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # vcpkg's autotools ports need these, and Ninja is what the presets use.
      # brew leaves anything the runner image already has in place.
      - name: Install build tools
        run: brew install ninja pkgconf autoconf automake libtool autoconf-archive

      # Same runtime-set binary cache path as the Linux job; see there for why it
      # is not set from `${{ github.workspace }}` in the workflow env: block.
      - name: Point vcpkg at the workspace binary cache
        shell: bash
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/vcpkg_bincache,readwrite" >> "$GITHUB_ENV"

      # Keys and the save conditions work as in the Linux job; see there.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        id: bincache
        with:
          path: vcpkg_bincache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/*.cmake', 'cmake/vcpkg-overlay-ports/**') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/*.cmake', 'cmake/vcpkg-overlay-ports/**') }}-
            vcpkg-bin-${{ runner.os }}-

      - name: Restore vcpkg downloads
        uses: actions/cache/restore@v4
        id: dlcache
        with:
          path: vcpkg/downloads
          key: vcpkg-dl-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-dl-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-dl-${{ runner.os }}-

      - name: Count restored dependency files
        id: before
        shell: bash
        run: |
          echo "bin=$(find vcpkg_bincache -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
          echo "dl=$(find vcpkg/downloads -maxdepth 1 -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Configure
        # -Werror as on the other platforms, so Clang's warnings gate the build.
        run: cmake --preset dist-macos -DMET_WERROR=ON

      - name: Check for new dependency files
        id: after
        if: always()
        shell: bash
        run: |
          bin=$(find vcpkg_bincache -type f 2>/dev/null | wc -l)
          dl=$(find vcpkg/downloads -maxdepth 1 -type f 2>/dev/null | wc -l)
          echo "bin=$([ "$bin" != "${{ steps.before.outputs.bin }}" ] && echo changed || echo same)" >> "$GITHUB_OUTPUT"
          echo "dl=$([ "$dl" != "${{ steps.before.outputs.dl }}" ] && echo changed || echo same)" >> "$GITHUB_OUTPUT"

      - name: Save vcpkg binary cache
        uses: actions/cache/save@v4
        # A cache write must never fail the job: on an early failure the
        # directory may not exist yet, and that is not an error worth reporting.
        continue-on-error: true
        if: always() && steps.after.outputs.bin == 'changed'
        with:
          path: vcpkg_bincache
          key: ${{ steps.bincache.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Save vcpkg downloads
        uses: actions/cache/save@v4
        continue-on-error: true
        if: always() && steps.after.outputs.dl == 'changed'
        with:
          path: vcpkg/downloads
          key: ${{ steps.dlcache.outputs.cache-primary-key }}-${{ github.run_id }}

      - name: Dump vcpkg logs on failure
        if: failure()
        run: |
          echo "===== vcpkg-manifest-install.log (names the failed port) ====="
          cat build/dist-macos/vcpkg-manifest-install.log 2>/dev/null || echo "(not found)"
          echo "===== port build stdout/stderr (the real error) ====="
          for f in $(find vcpkg/buildtrees -maxdepth 2 \
                       \( -name 'install-*-out.log' -o -name 'install-*-err.log' \
                          -o -name 'build-*-out.log' -o -name 'build-*-err.log' \) 2>/dev/null); do
            echo "----- $f -----"; tail -n 60 "$f"; done

      - name: Build
        run: cmake --build --preset dist-macos

      # The timing tripwires are left to the Linux runner, as on Windows.
      - name: Test
        run: ctest --preset dist-macos -E 'Warp\.(Projected)?PerformanceTripwire'

      # The install deploys Qt and every other library into the bundle with
      # macdeployqt, fails if anything still points outside it, and signs it ad
      # hoc (cmake/DeployMacBundle.cmake).
      - name: Install the app bundle
        run: cmake --install build/dist-macos --prefix "$GITHUB_WORKSPACE/dist"

      # As the Windows job starts its installed exe with only the OS on PATH:
      # with vcpkg_installed out of the way, a library the bundle still loads
      # from the build machine fails the launch.
      - name: Smoke-test the installed bundle
        run: |
          set -euxo pipefail
          mv vcpkg_installed vcpkg_installed.hidden
          status=0
          "dist/Met Viewer.app/Contents/MacOS/Met Viewer" --version || status=$?
          mv vcpkg_installed.hidden vcpkg_installed
          exit "$status"

      # Zipped with ditto, which keeps the bundle's symlinks, permissions and
      # signature; upload-artifact's own zip drops the executable bit.
      - name: Zip the app bundle
        run: ditto -c -k --keepParent "dist/Met Viewer.app" met-viewer-macos-arm64.zip

      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: met-viewer-macos-${{ github.sha }}
          path: met-viewer-macos-arm64.zip
          retention-days: 14
          if-no-files-found: error
