name: Release

# On a version tag (e.g. v0.1.0), build a distributable installer per platform
# and attach them to a DRAFT GitHub Release for review before publishing:
#   - Linux:   AppImage (dynamic Qt bundled by linuxdeploy)
#   - Windows: NSIS installer (dynamic Qt bundled by windeployqt via CPack)
# Artifacts are UNSIGNED; see the release notes for SmartScreen/Gatekeeper hints.
#
# The platform jobs only *build* and upload their output as workflow artifacts; a
# single final job creates the release. Having each platform attach its own asset
# meant both jobs raced to create-or-update the same release, and a draft release
# is not bound to its tag until published — so GitHub will hold two drafts for
# one tag, each with half the assets, and publishing the one you happen to see
# silently ships without the other platform. Collecting first also means a failed
# platform build produces no release at all, rather than a half-populated draft.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: only the final release job writes to the repository. The build
# jobs just produce files and no longer need write access at all.
permissions:
  contents: read

jobs:
  # Runs first, in seconds, so a version mismatch fails here rather than after an
  # hour of building. The AppImage and the portable zip are named from the tag,
  # while CPack names the Windows installer from project(VERSION) and the app
  # reports that same version via --version and its tile-server User-Agent. Those
  # are only consistent if the tag agrees with the sources, so that is checked
  # rather than assumed — the alternative, overriding CPack from the tag, would
  # relocate the inconsistency into the app rather than remove it.
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match project(VERSION) and vcpkg.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cmake_ver=$(sed -nE 's/^project\([^)]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          vcpkg_ver=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['version'])")
          echo "tag:            $tag"
          echo "CMakeLists.txt: $cmake_ver"
          echo "vcpkg.json:     $vcpkg_ver"
          if [ -z "$cmake_ver" ]; then
            echo "::error::could not parse project(VERSION) from CMakeLists.txt"
            exit 1
          fi
          if [ "$tag" != "$cmake_ver" ] || [ "$tag" != "$vcpkg_ver" ]; then
            echo "::error::version mismatch — release assets would carry different" \
                 "version numbers and the app's --version would disagree with its" \
                 "own installer filename. Bump project(VERSION) in CMakeLists.txt" \
                 "and \"version\" in vcpkg.json to $tag, or retag."
            exit 1
          fi
          echo "all three agree at $tag"

  linux:
    name: Linux AppImage
    needs: version-check
    runs-on: ubuntu-latest
    container: almalinux:9
    steps:
      - name: Install system build dependencies
        run: |
          set -euxo pipefail
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y \
            git cmake ninja-build gcc-c++ make perl zip file which tar \
            libxcb-devel libX11-devel mesa-libGLU-devel libXrender-devel \
            libXi-devel libxkbcommon-devel libxkbcommon-x11-devel mesa-libEGL-devel \
            gperf fontconfig-devel freetype-devel \
            xcb-util-cursor-devel xcb-util-wm-devel xcb-util-devel \
            xcb-util-image-devel xcb-util-keysyms-devel xcb-util-renderutil-devel \
            perl-IPC-Cmd perl-FindBin perl-Text-Template perl-Time-Piece \
            perl-Unicode-Normalize perl-Test-Harness perl-Module-Loaded \
            perl-ExtUtils-MakeMaker perl-Sys-Hostname \
            automake libtool autoconf-archive m4 bison flex \
            fuse-libs
          # AlmaLinux 9 ships autoconf 2.69, but some ports (libb2) need >= 2.71.
          # The autoconf tarball ships a pre-generated configure, so building it
          # needs only m4/perl/make (no bootstrap autoconf).
          curl -fsSLO https://ftp.gnu.org/gnu/autoconf/autoconf-2.71.tar.gz
          tar xf autoconf-2.71.tar.gz
          (cd autoconf-2.71 && ./configure --prefix=/usr/local >/dev/null \
             && make -j"$(nproc)" >/dev/null && make install >/dev/null)
          hash -r
          autoconf --version | head -1

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Trust workspace (git runs as root in the container)
        run: git config --global --add safe.directory '*'

      # Read-only: a release build consumes whatever CI already produced for this
      # dependency set but never writes, so a tag build cannot evict CI's caches.
      # VCPKG_BINARY_SOURCES is set here at runtime rather than in the workflow's
      # env: block, because `${{ github.workspace }}` is expanded on the *host*.
      # In a container job that yields /home/runner/work/... while the workspace
      # is mounted at /__w/... inside — so vcpkg wrote its binaries somewhere
      # actions/cache never looked, and the cache silently stayed empty.
      # $GITHUB_WORKSPACE is evaluated inside the job, so it is correct on both.
      - name: Point vcpkg at the workspace binary cache
        shell: bash
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/vcpkg_bincache,readwrite" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg_bincache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/*.cmake', 'cmake/vcpkg-overlay-ports/**') }}
          restore-keys: vcpkg-bin-${{ runner.os }}-

      - name: Restore vcpkg downloads
        uses: actions/cache/restore@v4
        with:
          path: vcpkg/downloads
          key: vcpkg-dl-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-dl-${{ runner.os }}-

      - name: Build
        run: |
          cmake --preset dist-linux
          cmake --build --preset dist-linux

      - name: Dump vcpkg logs on failure
        if: failure()
        run: |
          echo "===== vcpkg-manifest-install.log (names the failed port) ====="
          cat build/dist-linux/vcpkg-manifest-install.log 2>/dev/null || echo "(not found)"
          echo "===== port build stdout/stderr (the real error) ====="
          # Skip config-*.log: its arch-probe failures (arm_acle.h etc.) are expected noise.
          for f in $(find vcpkg/buildtrees -maxdepth 2 \
                       \( -name 'install-*-out.log' -o -name 'install-*-err.log' \
                          -o -name 'build-*-out.log' -o -name 'build-*-err.log' \) 2>/dev/null); do
            echo "----- $f -----"; tail -n 60 "$f"; done

      - name: Install into AppDir
        run: cmake --install build/dist-linux --prefix "$PWD/AppDir/usr"

      - name: Build AppImage
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          curl -fsSLO "$base/linuxdeploy-x86_64.AppImage"
          curl -fsSLO "$base/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          # FUSE is unavailable in containers; run the AppImages extracted.
          export APPIMAGE_EXTRACT_AND_RUN=1
          # Point the Qt plugin at the vcpkg Qt, and let linuxdeploy find the
          # bundled .so dependencies (PROJ, eccodes, netcdf, ...).
          export QMAKE="$PWD/vcpkg_installed/x64-linux-dynamic/tools/Qt6/bin/qmake"
          export LD_LIBRARY_PATH="$PWD/vcpkg_installed/x64-linux-dynamic/lib:${LD_LIBRARY_PATH:-}"
          # linuxdeploy-plugin-appimage names its output from $OUTPUT.
          export OUTPUT="met-viewer-${VERSION}-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir --plugin qt --output appimage \
            --executable AppDir/usr/bin/met_viewer \
            --desktop-file AppDir/usr/share/applications/met-viewer.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/met-viewer.png

      - name: Upload AppImage for the release job
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: met-viewer-*-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: version-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      # Read-only, as in the Linux job: consume CI's caches, never evict them.
      # Same runtime-set binary cache path as the Linux job; see there for why it
      # is not set from `${{ github.workspace }}` in the workflow env: block.
      - name: Point vcpkg at the workspace binary cache
        shell: bash
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/vcpkg_bincache,readwrite" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg_bincache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/*.cmake', 'cmake/vcpkg-overlay-ports/**') }}
          restore-keys: vcpkg-bin-${{ runner.os }}-

      - name: Restore vcpkg downloads
        uses: actions/cache/restore@v4
        with:
          path: vcpkg/downloads
          key: vcpkg-dl-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-dl-${{ runner.os }}-

      - name: Build
        run: |
          cmake --preset dist-windows
          cmake --build --preset dist-windows

      - name: Package (NSIS)
        # CPack runs the install (which invokes windeployqt via install(SCRIPT))
        # then builds the NSIS installer.
        working-directory: build/dist-windows
        run: cpack

      - name: Upload installer for the release job
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/dist-windows/met-viewer-*.exe
          if-no-files-found: error

      # The same install tree CI publishes on every run, zipped, for people who
      # would rather not run an installer (no admin rights, keeping versions side
      # by side, or just trying a build). Same payload as the NSIS package: both
      # come from the install() rules and the windeployqt script they invoke.
      - name: Stage portable build
        run: cmake --install build/dist-windows --prefix "${{ github.workspace }}/dist/met-viewer"

      # Zipped here rather than left to upload-artifact, because the release job
      # *downloads* artifacts before attaching them — an uploaded directory would
      # arrive expanded, and a release asset has to be a single file.
      # Named from the tag, matching the AppImage.
      - name: Zip portable build
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          Compress-Archive -Path dist/met-viewer `
                           -DestinationPath "met-viewer-$version-windows-x64.zip"

      - name: Upload portable build for the release job
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: met-viewer-*-windows-x64.zip
          if-no-files-found: error

  # Single place where the release is created, after every platform has produced
  # its asset. `needs` also gates it: if either build fails there is no release.
  release:
    name: Draft GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that needs it
    steps:
      # merge-multiple flattens every artifact into one directory, so the glob
      # below picks up each platform's output regardless of how many there are.
      - name: Collect platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what will be attached
        run: ls -lh artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: artifacts/*
